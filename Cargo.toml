[package]
name = "push-chess"
version = "0.1.0"
edition = "2024"
autobins = false

[workspace]
members = ["crates/native", "crates/wasm"]
default-members = [".", "crates/native"]
exclude = ["training/native"]
resolver = "3"

[features]
default = []
historical-engines = ["dep:smallvec"]
wasm = ["dep:tsify", "dep:wasm-bindgen"]

[dependencies]
arrayvec = "0.7"
smallvec = { version = "1.15", features = ["const_generics"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "=0.2.128", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"

[profile.release]
opt-level = 2
lto = "thin"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
invalid_value = "deny"

[lints]
workspace = true

[[example]]
name = "wasm_parity"
path = "tests/support/wasm_parity.rs"
