[package]
name = "push-chess"
version = "0.1.0"
edition = "2024"
autobins = false

[workspace]
members = ["crates/lab"]
default-members = [".", "crates/lab"]
exclude = ["training/native"]
resolver = "3"

[dependencies]
arrayvec = "0.7"
smallvec = { version = "1.15", features = ["const_generics"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 2
lto = "thin"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
invalid_value = "deny"

[lints]
workspace = true
