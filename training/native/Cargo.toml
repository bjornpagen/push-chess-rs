[package]
name = "pushzero-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
push-chess = { path = "../.." }
push-chess-lab = { path = "../../crates/lab" }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py311"] }
numpy = "0.26"

[profile.release]
opt-level = 3
lto = "thin"
