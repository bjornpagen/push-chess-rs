[package]
name = "cataclysm-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
push-chess = { path = "../..", default-features = false, features = ["wasm"] }
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
serde_json = "1"
serde = "1"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }

[lints]
workspace = true
